name: Feature request
description: Suggest something specific to build. For open-ended ideas, start a Discussion instead.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or problem, not just the solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would help?
      description: How you imagine it working.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
