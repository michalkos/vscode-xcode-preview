name: Release

# Runs when a version tag (v1.2.3) is pushed, usually by `pnpm release <patch|minor|major>`.
# Typechecks, tests and packages the extension, then publishes a GitHub Release with the
# .vsix attached and that version's CHANGELOG.md section as the notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # vscode:prepublish runs typecheck, tests and the production build first.
      - name: Package
        run: pnpm package

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '/^## /{ if (found) exit; if (index($0, "[" v "]")) { found = 1; next } } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" xcode-preview-*.vsix --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
